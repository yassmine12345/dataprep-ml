services:
  - type: web
    name: dataprep-ml
    env: python
    buildCommand: "pip install -r backend/requirements.txt && mkdir -p frontend/dist && cp -r frontend/public/* frontend/dist/"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
